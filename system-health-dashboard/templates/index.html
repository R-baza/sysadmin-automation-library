<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center fw-bold text-dark">Atlas System Health Dashboard</h1>
        
        <div class="row g-4">
            <!-- CPU Card -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title text-muted">CPU Usage</h5>
                        <h2 id="cpu-text" class="display-6 fw-bold mb-3">0%</h2>
                        <div class="progress" style="height: 15px;">
                            <div id="cpu-bar" class="progress-bar bg-primary" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Memory Card -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Memory Usage</h5>
                        <h2 id="memory-text" class="display-6 fw-bold mb-3">0%</h2>
                        <div class="progress" style="height: 15px;">
                            <div id="memory-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Disk Card -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Disk Usage (Root)</h5>
                        <h2 id="disk-text" class="display-6 fw-bold mb-3">0%</h2>
                        <div class="progress" style="height: 15px;">
                            <div id="disk-bar" class="progress-bar bg-warning" role="progressbar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Load Average Card -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Load Average (1, 5, 15m)</h5>
                        <h2 id="load-average" class="display-6 fw-bold mb-3">-</h2>
                        <p class="text-muted small mb-0">System activity over time</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/system-info')
                .then(response => response.json())
                .then(data => {
                    // Update CPU
                    document.getElementById('cpu-text').textContent = data.cpu_percent + '%';
                    document.getElementById('cpu-bar').style.width = data.cpu_percent + '%';

                    // Update Memory
                    document.getElementById('memory-text').textContent = data.memory_percent + '%';
                    document.getElementById('memory-bar').style.width = data.memory_percent + '%';

                    // Update Disk
                    document.getElementById('disk-text').textContent = data.disk_percent + '%';
                    document.getElementById('disk-bar').style.width = data.disk_percent + '%';

                    // Update Load Average
                    if (Array.isArray(data.load_average)) {
                        document.getElementById('load-average').textContent = data.load_average.map(v => v.toFixed(2)).join(', ');
                    } else {
                        document.getElementById('load-average').textContent = data.load_average;
                    }
                })
                .catch(error => console.error('Error fetching system info:', error));
        }

        // Run immediately, then poll every 2 seconds
        updateDashboard();
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
